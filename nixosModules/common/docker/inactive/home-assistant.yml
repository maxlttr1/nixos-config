services:
  home-assistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - $STATE_DIRECTORY/homeAssistant:/config
      - /etc/localtime:/etc/localtime:ro
    #   - /run/dbus:/run/dbus:ro # For bluetooth support
    privileged: true
    network_mode: host # UI accessible via port 8123
    environment:
      TZ: Europe/Paris
    # devices:
    #  - /dev/ttyUSB0:/dev/ttyUSB0
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    volumes:
      - $STATE_DIRECTORY/mosquitto/config:/mosquitto/config
      - $STATE_DIRECTORY/mosquitto/data:/mosquitto/data
      - $STATE_DIRECTORY/mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
    restart: unless-stopped
