services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    networks:
      - local_websecure
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime-kuma.tls=true
      - traefik.http.routers.uptime-kuma.tls.certresolver=myresolver
      - traefik.http.routers.uptime-kuma.entrypoints=local_websecure
      - traefik.http.routers.uptime-kuma.rule=Host(`uptime-kuma.home.maxlttr.fr`)
      - traefik.http.services.uptime-kuma.loadbalancer.server.port=3001
    volumes:
      - $STATE_DIRECTORY/uptime-kuma/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 127.0.0.1:3001:3001
      - "${TAILSCALE_IP}:3001:3001"
    restart: unless-stopped

networks:
  local_websecure:
    external: true
