services:
  traefik:
    image: traefik:latest
    networks:
      - proxy
      # - local
      - local_websecure
    ports:
      # - 80:80
      - 443:443
      - 444:444
      - 127.0.0.1:8080:8080
      - "${TAILSCALE_IP}:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $STATE_DIRECTORY/traefik/:/var/traefik/certs/:rw
      - ./traefik-dynamic:/etc/traefik/dynamic:ro
      # - ${HOME}/.config/sops-nix/secrets/domain/_wildcard.maxlttr.home.pem:/certs/_wildcard.maxlttr.home.pem:ro
      # - ${HOME}/.config/sops-nix/secrets/domain/_wildcard.maxlttr.home-key.pem:/certs/_wildcard.maxlttr.home-key.pem:ro
    command:
      - "--global.sendAnonymousUsage=false"
      - "--log.level=DEBUG"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--api.debug=true"
      # - "--entrypoints.local.address=:80"
      # - "--entrypoints.local.http.redirections.entrypoint.to=websecure"
      # - "--entrypoints.local.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.local_websecure.address=:444"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--certificatesresolvers.myresolver.acme.email=maxime.lettier@protonmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/var/traefik/certs/acme.json"
      # - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.dnschallenge=true"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.provider=ovh"
    env_file:
      - ${HOME}/.config/sops-nix/secrets/env/ovh-perm.env
    restart: unless-stopped

networks:
  proxy:
    external: true
  # local:
  #   external: true
  local_websecure:
    external: true
