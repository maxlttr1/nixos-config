services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=myresolver
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.maxlttr.fr`)
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - sablier.enable=true
      - sablier.group=jellyfin
      - traefik.http.routers.jellyfin.middlewares=jellyfin
      - traefik.http.middlewares.jellyfin.plugin.sablier.group=jellyfin
      - traefik.http.middlewares.jellyfin.plugin.sablier.sessionDuration=30m
      - traefik.http.middlewares.jellyfin.plugin.sablier.dynamic.displayName=Jellyfin
      - traefik.http.middlewares.jellyfin.plugin.sablier.dynamic.showDetails=true
      - traefik.http.middlewares.jellyfin.plugin.sablier.dynamic.theme=ghost
      - traefik.http.middlewares.jellyfin.plugin.sablier.dynamic.refreshFrequency=5s
      - traefik.docker.allownonrunning=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
    volumes:
      - $STATE_DIRECTORY/jellyfin/library:/config
      - $STATE_DIRECTORY/movies:/data/movies
      - $STATE_DIRECTORY/i2p/i2ptorrents:/data/movies/i2p
      - $STATE_DIRECTORY/tvshows:/data/tvshows
      - ${HOME}/Syncthing/music:/data/music:ro
    ports:
      - 127.0.0.1:8096:8096
      - "${TAILSCALE_IP}:8096:8096"
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

networks:
  proxy:
    external: true
