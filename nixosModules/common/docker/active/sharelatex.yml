services:
  sharelatex:
    image: sharelatex/sharelatex:latest
    ports:
      - "${TAILSCALE_IP}:6060:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.overleaf.tls=true
      - traefik.http.routers.overleaf.tls.certresolver=myresolver
      - traefik.http.routers.overleaf.entrypoints=websecure
      - traefik.http.routers.overleaf.rule=Host(`overleaf.maxlttr.fr`)
      - traefik.http.services.overleaf.loadbalancer.server.port=80
      - sablier.enable=true
      - sablier.group=overleaf
      - traefik.http.routers.overleaf.middlewares=overleaf
      - traefik.http.middlewares.overleaf.plugin.sablier.group=overleaf
      - traefik.http.middlewares.overleaf.plugin.sablier.sessionDuration=10m
      - traefik.http.middlewares.overleaf.plugin.sablier.dynamic.displayName=Overleaf
      - traefik.http.middlewares.overleaf.plugin.sablier.dynamic.showDetails=true
      - traefik.http.middlewares.overleaf.plugin.sablier.dynamic.theme=ghost
      - traefik.http.middlewares.overleaf.plugin.sablier.dynamic.refreshFrequency=5s
      - traefik.docker.allownonrunning=true
    networks:
      - proxy
    volumes:
      - $STATE_DIRECTORY/overleaf/data:/var/lib/overleaf
      - $STATE_DIRECTORY/overleaf/logs:/var/log/overleaf
    environment:
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex
      OVERLEAF_REDIS_HOST: redis
    env_file:
      - /run/secrets/env/overleaf.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo
    networks:
      - proxy
    labels:
      - sablier.enable=true
      - sablier.group=overleaf
    command: --replSet overleaf
    volumes:
      - $STATE_DIRECTORY/overleaf/mongo:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval ''try { rs.status().ok } catch (e) { rs.initiate({_id:"overleaf",members:[{_id:0,host:"mongo:27017"}]}).ok }''',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis
    networks:
      - proxy
    labels:
      - sablier.enable=true
      - sablier.group=overleaf
    volumes:
      - $STATE_DIRECTORY/overleaf/redis:/data
    restart: unless-stopped

networks:
  proxy:
    external: true
