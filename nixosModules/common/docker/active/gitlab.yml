services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    hostname: "gitlab.maxlttr.fr"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.gitlab.tls=true
      - traefik.http.routers.gitlab.tls.certresolver=myresolver
      - traefik.http.routers.gitlab.entrypoints=websecure
      - traefik.http.routers.gitlab.rule=Host(`gitlab.maxlttr.fr`)
      - traefik.http.services.gitlab.loadbalancer.server.port=80
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # Add any other gitlab.rb configuration here, each on its own line
        external_url 'https://gitlab.maxlttr.fr'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
    ports:
      # - 80:80
      # - 443:443
      - "${TAILSCALE_IP}:2222:22"
    volumes:
      - $STATE_DIRECTORY/config:/etc/gitlab
      - $STATE_DIRECTORY/logs:/var/log/gitlab
      - $STATE_DIRECTORY/data:/var/opt/gitlab
    shm_size: "256m"
    restart: unless-stopped

networks:
  proxy:
    external: true
