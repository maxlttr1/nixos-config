services:
  freshrss:
    image: freshrss/freshrss:edge # Stable does not backport the latest security fixes
    volumes:
      - $STATE_DIRECTORY/freshrss/freshrss_extensions:/var/www/FreshRSS/extensions
      - $STATE_DIRECTORY/freshrss/freshrss_data:/var/www/FreshRSS/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.freshrss.tls=true
      - traefik.http.routers.freshrss.tls.certresolver=myresolver
      - traefik.http.routers.freshrss.entrypoints=websecure
      - traefik.http.routers.freshrss.rule=Host(`freshrss.maxlttr.fr`)
      - traefik.http.services.freshrss.loadbalancer.server.port=80
      - sablier.enable=true
      - sablier.group=freshrss
      - traefik.http.routers.freshrss.middlewares=freshrss
      - traefik.http.middlewares.freshrss.plugin.sablier.group=freshrss
      - traefik.http.middlewares.freshrss.plugin.sablier.sessionDuration=30m
      - traefik.http.middlewares.freshrss.plugin.sablier.dynamic.displayName=FreshRSS
      - traefik.http.middlewares.freshrss.plugin.sablier.dynamic.showDetails=true
      - traefik.http.middlewares.freshrss.plugin.sablier.dynamic.theme=ghost
      - traefik.http.middlewares.freshrss.plugin.sablier.dynamic.refreshFrequency=5s
      - traefik.docker.allownonrunning=true
    environment:
      - "CRON_MIN=1,31"
      - TZ=Europe/Paris
    ports:
      - 127.0.0.1:8088:80
      - "${TAILSCALE_IP}:8088:80"
    logging:
      driver: json-file
      options:
        max-size: 10m
    restart: unless-stopped

networks:
  proxy:
    external: true
