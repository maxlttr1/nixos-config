services:
  gluetun-deluge:
    image: qmcgaw/gluetun
    networks:
      - local_websecure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
    env_file:
      - ${HOME}/.config/sops-nix/secrets/env/vpn.env
    ports:
      - 127.0.0.1:8112:8112
      - "${TAILSCALE_IP}:8112:8112"
      - 6881:6881
      - 6881:6881/udp
    labels:
      - traefik.enable=true
      - traefik.http.routers.gluetun-deluge.tls=true
      - traefik.http.routers.gluetun-deluge.tls.certresolver=myresolver
      - traefik.http.routers.gluetun-deluge.entrypoints=local_websecure
      - traefik.http.routers.gluetun-deluge.rule=Host(`deluge.home.maxlttr.fr`)
      - traefik.http.services.gluetun-deluge.loadbalancer.server.port=8112
    restart: unless-stopped
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    depends_on:
      - gluetun-deluge
    network_mode: "service:gluetun-deluge"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
    volumes:
      - $STATE_DIRECTORY/deluge/config:/config
      - $STATE_DIRECTORY/movies:/downloads
    restart: unless-stopped

networks:
  local_websecure:
    external: true
