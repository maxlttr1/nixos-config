services:
  it-tools:
    image: corentinth/it-tools:latest
    networks:
      - local_websecure
    ports:
      - 127.0.0.1:8888:80
      - "${TAILSCALE_IP}:8888:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.it-tools.tls=true
      - traefik.http.routers.it-tools.tls.certresolver=myresolver
      - traefik.http.routers.it-tools.entrypoints=local_websecure
      - traefik.http.routers.it-tools.rule=Host(`it-tools.home.maxlttr.fr`)
      - traefik.http.services.it-tools.loadbalancer.server.port=80
      - sablier.enable=true
      - sablier.group=it-tools
      - traefik.http.routers.it-tools.middlewares=it-tools
      - traefik.http.middlewares.it-tools.plugin.sablier.group=it-tools
      - traefik.http.middlewares.it-tools.plugin.sablier.sessionDuration=1m
      - traefik.http.middlewares.it-tools.plugin.sablier.dynamic.displayName=IT Tools
      - traefik.http.middlewares.it-tools.plugin.sablier.dynamic.showDetails=true
      - traefik.http.middlewares.it-tools.plugin.sablier.dynamic.theme=hacker-terminal
      - traefik.http.middlewares.it-tools.plugin.sablier.dynamic.refreshFrequency=5s
      - traefik.docker.allownonrunning=true
    restart: unless-stopped

networks:
  local_websecure:
    external: true
