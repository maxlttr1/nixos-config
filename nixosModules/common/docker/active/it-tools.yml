services:
  it-tools:
    image: corentinth/it-tools:latest
    networks:
      - local_websecure
    ports:
      - 127.0.0.1:8888:80
      - "${TAILSCALE_IP}:8888:80"
    labels:
      - sablier.enable=true
      - sablier.group=mygroup
      - traefik.enable=true
      - traefik.http.routers.it-tools.tls=true
      - traefik.http.routers.it-tools.tls.certresolver=myresolver
      - traefik.http.routers.it-tools.entrypoints=local_websecure
      - traefik.http.routers.it-tools.rule=Host(`it-tools.maxlttr.fr`) || Host(`it-tools.homemaxlttr7.duckdns.org`)
      - traefik.http.services.it-tools.loadbalancer.server.port=80
    restart: unless-stopped

networks:
  local_websecure:
    external: true
