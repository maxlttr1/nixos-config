services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    networks:
      - default
      - local_websecure
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=local_websecure
      - traefik.http.routers.homarr.tls=true
      - traefik.http.routers.homarr.tls.certresolver=myresolver
      - traefik.http.routers.homarr.entrypoints=local_websecure
      - traefik.http.routers.homarr.rule=Host(`homarr.home.maxlttr.fr`)
      - traefik.http.services.homarr.loadbalancer.server.port=7575
      - sablier.enable=true
      - sablier.group=homarr
      - traefik.http.routers.homarr.middlewares=homarr
      - traefik.http.middlewares.homarr.plugin.sablier.group=homarr
      - traefik.http.middlewares.homarr.plugin.sablier.sessionDuration=5m
      - traefik.http.middlewares.homarr.plugin.sablier.dynamic.displayName=Homarr
      - traefik.http.middlewares.homarr.plugin.sablier.dynamic.showDetails=true
      - traefik.http.middlewares.homarr.plugin.sablier.dynamic.theme=ghost
      - traefik.http.middlewares.homarr.plugin.sablier.dynamic.refreshFrequency=5s
      - traefik.docker.allownonrunning=true
    ports:
      - "${TAILSCALE_IP}:7575:7575"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - homarr:/appdata
    env_file:
      - /run/secrets/env/homarr.env
    restart: unless-stopped

volumes:
  homarr:
    name: homarr
    external: true

networks:
  local_websecure:
    external: true
  proxy:
    external: true
