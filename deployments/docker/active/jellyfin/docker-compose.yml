services:
  jellyfin:
    image: ghcr.io/linuxserver/jellyfin:latest
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=myresolver
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.maxlttr.fr`)
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - sablier.enable=true
      - sablier.group=jellyfin
      - traefik.http.routers.jellyfin.middlewares=jellyfin
      - traefik.http.middlewares.jellyfin.plugin.sablier.group=jellyfin
      - traefik.http.middlewares.jellyfin.plugin.sablier.sessionDuration=30m
      - traefik.http.middlewares.jellyfin.plugin.sablier.dynamic.displayName=Jellyfin
      - traefik.http.middlewares.jellyfin.plugin.sablier.dynamic.showDetails=true
      - traefik.http.middlewares.jellyfin.plugin.sablier.dynamic.theme=ghost
      - traefik.http.middlewares.jellyfin.plugin.sablier.dynamic.refreshFrequency=5s
      - traefik.docker.allownonrunning=true
      - cd.doco.deployment.autostart=false
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
    volumes:
      - jellyfin_library:/config
      - shared_movies:/data/movies
      - shared_i2ptorrents:/data/movies/i2p
      - shared_tvshows:/data/tvshows
      - /var/lib/docker/volumes/nextcloud_aio_nextcloud_data/_data/Maxime/files/music:/data/music:ro
    ports:
      - "${TAILSCALE_IP}:8096:8096"
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

volumes:
  jellyfin_library:
    name: jellyfin_library
    external: true
  shared_movies:
    name: shared_movies
    external: true
  shared_tvshows:
    name: shared_tvshows
    external: true
  shared_i2ptorrents:
    name: shared_i2ptorrents
    external: true

networks:
  proxy:
    external: true
