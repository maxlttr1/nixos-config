services:
  stalwart:
    image: stalwartlabs/stalwart:latest # Latest stable release
    init: true
    networks:
      - local_cloud
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.stalwart.tls=true
      - traefik.http.routers.stalwart.tls.certresolver=myresolver
      - traefik.http.routers.stalwart.entrypoints=websecure
      - traefik.http.routers.stalwart.rule=Host(`mail.maxlttr.fr`)
      - traefik.http.services.stalwart.loadbalancer.server.port=8080
    ports:
      - 25:25 # SMTP, mail from other servers (STARTTLS)
      # - 465:465 # SMTP, submission from clients	(Implicit TLS)
      # - 993:993 # IMAP (Implicit TLS)
      # - 995:995 # POP3S, secure POP3 mailbox download (Implicit TLS)
      # - 4190:4190 # ManageSieve, mail filter script management (STARTTLS)
      # - 443:443 # HTTP: JMAP, CalDAV, CardDAV, WebDAV, WebUI, OAuth, autoconfiguration (Implicit TLS)
      - "${TAILSCALE_IP}:8081:8080" # HTTP admin/UI bound to Tailscale IP only
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    restart: unless-stopped

volumes:
  stalwart-etc:
    name: stalwart-etc
  stalwart-data:
    name: stalwart-data

networks:
  local_cloud:
    external: true
  proxy:
    external: true
