services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.forgejo.tls=true
      - traefik.http.routers.forgejo.tls.certresolver=myresolver
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.routers.forgejo.rule=Host(`forgejo.maxlttr.fr`)
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
    environment:
      - USER_UID=${PUID}
      - USER_GID=${PGID}
    volumes:
      - forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${TAILSCALE_IP}:3000:3000"
      - "${TAILSCALE_IP}:222:22"
    restart: unless-stopped

volumes:
  forgejo:
    name: forgejo
    external: true

networks:
  proxy:
    external: true
