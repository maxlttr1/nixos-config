services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:ollama
    networks:
      - local_websecure
    ports:
      - "${TAILSCALE_IP}:3030:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.openwebui.tls=true
      - traefik.http.routers.openwebui.tls.certresolver=myresolver
      - traefik.http.routers.openwebui.entrypoints=local_websecure
      - traefik.http.routers.openwebui.rule=Host(`openwebui.home.maxlttr.fr`)
      - traefik.http.services.openwebui.loadbalancer.server.port=8080
      - sablier.enable=true
      - sablier.group=openwebui
      - traefik.http.routers.openwebui.middlewares=openwebui
      - traefik.http.middlewares.openwebui.plugin.sablier.group=openwebui
      - traefik.http.middlewares.openwebui.plugin.sablier.sessionDuration=5m
      - traefik.http.middlewares.openwebui.plugin.sablier.dynamic.displayName=OpenWebUI
      - traefik.http.middlewares.openwebui.plugin.sablier.dynamic.showDetails=true
      - traefik.http.middlewares.openwebui.plugin.sablier.dynamic.theme=ghost
      - traefik.http.middlewares.openwebui.plugin.sablier.dynamic.refreshFrequency=5s
      - traefik.docker.allownonrunning=true
    volumes:
      - openwebui_data:/app/backend/data
      - openwebui_ollama:/root/.ollama
    restart: unless-stopped

volumes:
  openwebui_data:
    name: openwebui_data
    external: true
  openwebui_ollama:
    name: openwebui_ollama
    external: true

networks:
  local_websecure:
    external: true
