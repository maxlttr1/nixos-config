services:
  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - rustdesk-hbbs:/root
    network_mode: "host"

    depends_on:
      - rustdesk-hbbr
    restart: unless-stopped

  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - rustdesk-hbbr:/root
    network_mode: "host"
    restart: unless-stopped

volumes:
  rustdesk-hbbs:
    name: rustdesk-hbbs
  rustdesk-hbbr:
    name: rustdesk-hbbr
